<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOURCEIUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040405;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }

    /* Full-Width Anton Backdrop Banner */
    #banner-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    #banner-text {
      font-family: 'Anton', sans-serif;
      font-size: 21.2vw;
      line-height: 1.15;
      padding: 0.08em 0;
      letter-spacing: -0.012em;
      text-transform: uppercase;
      white-space: nowrap;
      width: 100vw;
      text-align: center;
      background: linear-gradient(
        180deg,
        rgba(185, 185, 195, 0.52) 0%,
        rgba(125, 125, 135, 0.36) 55%,
        rgba(68, 68, 76, 0.22) 85%,
        rgba(26, 26, 30, 0.09) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-mask-image: radial-gradient(
        ellipse 22% 42% at 50% 54%,
        rgba(0, 0, 0, 0.24) 0%,
        rgba(0, 0, 0, 0.78) 65%,
        rgba(0, 0, 0, 1) 100%
      );
      mask-image: radial-gradient(
        ellipse 22% 42% at 50% 54%,
        rgba(0, 0, 0, 0.24) 0%,
        rgba(0, 0, 0, 0.78) 65%,
        rgba(0, 0, 0, 1) 100%
      );
    }

    /* WebGL Canvas */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      display: block;
    }

    /* Light Film Grain */
    #film-grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ------------------------------------------------------------------
       Preloader: dot-matrix wave field + liquid-fill wordmark
       ------------------------------------------------------------------ */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0d0406 0%, #040405 72%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.75s ease;
    }

    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loader-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 25%, transparent 100%);
      mask-image: radial-gradient(ellipse 75% 70% at 50% 50%, #000 25%, transparent 100%);
    }

    .loader-core {
      position: relative;
      z-index: 1;
      width: min(92vw, 900px);
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .loader-word {
      --e: 6%;
      position: relative;
      font-family: 'Anton', sans-serif;
      font-size: clamp(42px, 12.5vw, 132px);
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }

    .lw-outline {
      display: block;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
    }

    .lw-fillwrap {
      position: absolute;
      inset: 0;
      filter: drop-shadow(0 0 16px rgba(230, 25, 34, 0.5));
    }

    .lw-fill {
      display: block;
      color: transparent;
      clip-path: inset(calc(100% - var(--e)) 0 0 0);
      background-image:
        linear-gradient(105deg, transparent 38%, rgba(255, 205, 210, 0.6) 50%, transparent 62%),
        linear-gradient(180deg, #ff4048 0%, #c40c14 55%, #6e0509 100%);
      background-size: 260% 100%, 100% 100%;
      background-repeat: no-repeat;
      background-position: 160% 0, 0 0;
      -webkit-background-clip: text;
      background-clip: text;
      animation: sheen 2.4s linear infinite;
    }

    @keyframes sheen {
      from { background-position: 160% 0, 0 0; }
      to   { background-position: -60% 0, 0 0; }
    }

    .lw-edge {
      position: absolute;
      left: -3%;
      right: -3%;
      bottom: var(--e);
      height: 1px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 96, 104, 0.95), transparent);
      box-shadow: 0 0 14px 2px rgba(230, 25, 34, 0.7);
      transition: opacity 0.35s ease;
    }

    .loader-meta {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .loader-status {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      padding-bottom: 4px;
    }

    .loader-status.swap {
      animation: statusIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes statusIn {
      from { opacity: 0; transform: translateY(6px); filter: blur(3px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .loader-pct {
      font-size: clamp(28px, 5vw, 46px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.02em;
      color: #ff1e27;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px rgba(255, 30, 39, 0.5);
    }

    .loader-pct i {
      font-style: normal;
      font-size: 0.42em;
      margin-left: 3px;
      opacity: 0.7;
    }

    .loader-line {
      position: relative;
      height: 2px;
      border-radius: 99px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
    }

    #bar-fill {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, #6e0509 0%, #e61922 70%, #ff5259 100%);
      box-shadow: 0 0 14px rgba(230, 25, 34, 0.9);
      will-change: transform;
    }

    #bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85));
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .lw-fill { animation: none; }
      .loader-status.swap { animation: none; }
    }

    /* Single Reveal Button */
    #ui-controls {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #ui-controls.ready {
      opacity: 1;
      pointer-events: auto;
    }

    #reveal-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(18, 6, 8, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #f2f2f5;
      padding: 10px 28px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    #reveal-btn:hover {
      border-color: rgba(210, 18, 26, 0.85);
      background: rgba(34, 7, 10, 0.88);
      box-shadow: 0 0 22px rgba(210, 18, 26, 0.45);
    }
  </style>
</head>
<body>

  <!-- Background Word in Anton -->
  <div id="banner-wrap">
    <div id="banner-text">SOURCEIUM</div>
  </div>

  <!-- Full-Screen WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Subtle Film Grain -->
  <div id="film-grain"></div>

  <!-- Preloader: dot-matrix wave field + liquid-fill wordmark -->
  <div id="preloader">
    <canvas id="loader-canvas"></canvas>
    <div class="loader-core">
      <div class="loader-word" id="loader-word" aria-hidden="true">
        <span class="lw-outline">SOURCEIUM</span>
        <div class="lw-fillwrap"><span class="lw-fill">SOURCEIUM</span></div>
        <div class="lw-edge" id="lw-edge"></div>
      </div>
      <div class="loader-meta">
        <span class="loader-status" id="loader-status">Loading Studio &amp; Clay Assets</span>
        <span class="loader-pct"><span id="progress-pct">00</span><i>%</i></span>
      </div>
      <div class="loader-line"><div id="bar-fill"></div></div>
    </div>
  </div>

  <!-- Single Reveal Button -->
  <div id="ui-controls">
    <button id="reveal-btn">Reveal</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const TARGET_DOT_COUNT = 78000;
    const REVEAL_DURATION = 3.6;

    const preloader = document.getElementById('preloader');
    const uiControls = document.getElementById('ui-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const bannerText = document.getElementById('banner-text');

    // Lets the preloader keep animating while the heavy geometry work runs in chunks
    const yieldToUI = () => new Promise((r) => setTimeout(r, 16));
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    /* ------------------------------------------------------------------
       Preloader controller
       - progress is eased so it never jumps
       - dot-matrix field: a crimson front rises with the progress, leaving a
         rippling lit trail; the wordmark fills like liquid at the same pace
       ------------------------------------------------------------------ */
    const Loader = (() => {
      const canvas = document.getElementById('loader-canvas');
      const ctx = canvas.getContext('2d');
      const pctEl = document.getElementById('progress-pct');
      const statusEl = document.getElementById('loader-status');
      const barFill = document.getElementById('bar-fill');
      const wordEl = document.getElementById('loader-word');
      const edgeEl = document.getElementById('lw-edge');

      let target = 0, shown = 0, t = 0;
      let last = performance.now();
      let w = 0, h = 0, dpr = 1, raf = 0;
      let fired = false;
      let statusText = statusEl.textContent;
      let resolveFinished;
      const finished = new Promise((r) => { resolveFinished = r; });

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }

      function set(pct, text) {
        target = Math.max(target, Math.min(100, pct));
        if (text && text !== statusText) {
          statusText = text;
          statusEl.textContent = text;
          statusEl.classList.remove('swap');
          void statusEl.offsetWidth;
          statusEl.classList.add('swap');
        }
      }

      function drawField() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        const p = shown / 100;
        const frontY = h * (1.04 - 1.08 * p);
        const step = w < 640 ? 20 : 26;
        const cols = Math.ceil(w / step) + 1;
        const rows = Math.ceil(h / step) + 1;
        const ox = (w - (cols - 1) * step) / 2;
        const oy = (h - (rows - 1) * step) / 2;
        const cx = w / 2, cy = h / 2;

        for (let j = 0; j < rows; j++) {
          const y = oy + j * step;
          const d = y - frontY;                          // > 0 : already filled
          const g = Math.exp(-(d * d) / (80 * 80));      // glow around the front

          for (let i = 0; i < cols; i++) {
            const x = ox + i * step;
            const wave = 0.5 + 0.5 * Math.sin(x * 0.011 + y * 0.007 - t * 2.4);
            let r, a, rr, gg, bb;

            if (d > 0) {
              const fade = 0.35 + 0.65 * Math.exp(-d / (h * 0.55));
              r = 1.0 + 0.9 * wave * fade + 1.9 * g;
              a = (0.16 + 0.34 * wave) * fade + 0.6 * g;
              rr = 230 + 25 * g;
              gg = 25 + 60 * g;
              bb = 34 + 60 * g;
            } else {
              const rad = Math.hypot(x - cx, y - cy);
              const breathe = 0.5 + 0.5 * Math.sin(rad * 0.018 - t * 2.0);
              r = 0.9 + 0.3 * breathe + 1.4 * g;
              a = 0.05 + 0.05 * breathe + 0.5 * g;
              rr = 235 - 5 * g;
              gg = 235 - 210 * g;
              bb = 240 - 206 * g;
            }

            ctx.beginPath();
            ctx.arc(x, y, r, 0, 6.2832);
            ctx.fillStyle = 'rgba(' + (rr | 0) + ',' + (gg | 0) + ',' + (bb | 0) + ',' + a.toFixed(3) + ')';
            ctx.fill();
          }
        }
      }

      function frame(now) {
        raf = requestAnimationFrame(frame);
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        t += dt;

        // Smooth, never-jumping progress: exponential ease plus a minimum creep
        const gap = target - shown;
        shown += gap * Math.min(1, dt * 4.5) + Math.sign(gap) * Math.min(Math.abs(gap), dt * 6);
        if (target >= 100 && shown > 99.4) shown = 100;

        const p = shown / 100;
        pctEl.textContent = String(Math.floor(shown)).padStart(2, '0');
        barFill.style.transform = 'scaleX(' + p + ')';
        wordEl.style.setProperty('--e', (6 + 88 * p).toFixed(2) + '%');
        edgeEl.style.opacity = (p > 0.004 && p < 0.996) ? '1' : '0';

        drawField();

        if (shown >= 100 && !fired) {
          fired = true;
          resolveFinished();
        }
      }

      function stop() {
        cancelAnimationFrame(raf);
      }

      resize();
      window.addEventListener('resize', resize);
      raf = requestAnimationFrame(frame);

      return { set, finished, stop };
    })();

    function setProgress(pct, statusText) {
      Loader.set(pct, statusText);
    }

    function fetchImageWithProgress(paths, onProgress) {
      return new Promise((resolve, reject) => {
        let index = 0;

        function attempt() {
          if (index >= paths.length) {
            reject(new Error('Image load failed'));
            return;
          }
          const url = paths[index++];
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.responseType = 'blob';

          xhr.onprogress = (e) => {
            if (e.lengthComputable && onProgress) {
              onProgress(e.loaded / e.total);
            }
          };

          xhr.onload = () => {
            if (xhr.status === 200 || xhr.status === 0) {
              const blobUrl = URL.createObjectURL(xhr.response);
              const img = new Image();
              img.onload = () => {
                URL.revokeObjectURL(blobUrl);
                if (onProgress) onProgress(1);
                resolve(img);
              };
              img.onerror = attempt;
              img.src = blobUrl;
            } else {
              attempt();
            }
          };

          xhr.onerror = attempt;
          xhr.send();
        }

        attempt();
      });
    }

    async function boot() {
      try {
        const fileProgress = [0, 0, 0];
        const updateDownloadPct = () => {
          const avg = (fileProgress[0] + fileProgress[1] + fileProgress[2]) / 3;
          setProgress(avg * 70, 'Loading Studio & Clay Assets');
        };

        const [photoImg, frontImg, sideImg] = await Promise.all([
          fetchImageWithProgress(['/photo.png', './photo.png', 'photo.png'], (p) => { fileProgress[0] = p; updateDownloadPct(); }),
          fetchImageWithProgress(['/clay-front.png', './clay-front.png', 'clay-front.png'], (p) => { fileProgress[1] = p; updateDownloadPct(); }),
          fetchImageWithProgress(['/clay-side.png', './clay-side.png', 'clay-side.png'], (p) => { fileProgress[2] = p; updateDownloadPct(); })
        ]);

        setProgress(74, 'Reading Side-Profile Depth');
        await yieldToUI();
        await buildBustAndScene(photoImg, frontImg, sideImg);
      } catch (err) {
        console.error(err);
        setProgress(0, 'Could not load assets');
      }
    }

    function smoothstep01(e0, e1, v) {
      const t = Math.max(0, Math.min(1, (v - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    function spow(v, e) {
      return Math.sign(v) * Math.pow(Math.abs(v), e);
    }

    async function buildBustAndScene(photoImg, frontImg, sideImg) {
      const W = 960;
      const H = 540;

      function extractPixels(img, width, height) {
        const c = document.createElement('canvas');
        c.width = width;
        c.height = height;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        return ctx.getImageData(0, 0, width, height).data;
      }

      const photoData = extractPixels(photoImg, W, H);
      const frontData = extractPixels(frontImg, W, H);
      const sideData  = extractPixels(sideImg, W, H);

      setProgress(80, 'Merging Front & Side Profiles');
      await yieldToUI();

      // ------------------------------------------------------------------
      // 1) Side-profile silhouette per row: front surface (sMin) and back
      //    surface (sMax) of the clay bust seen at 90 degrees.
      //    This is the authoritative depth profile of the whole bust.
      // ------------------------------------------------------------------
      const rawSideMin = new Float32Array(H);
      const rawSideMax = new Float32Array(H);
      const rawSideValid = new Uint8Array(H);

      for (let y = 0; y < H; y++) {
        let sMin = W, sMax = 0;
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const gray = (sideData[i] + sideData[i + 1] + sideData[i + 2]) / 3;
          if (gray < 242) {
            if (x < sMin) sMin = x;
            if (x > sMax) sMax = x;
          }
        }
        if (sMax > sMin + 6) {
          rawSideValid[y] = 1;
          rawSideMin[y] = sMin;
          rawSideMax[y] = sMax;
        }
      }

      // Fill any gap row with the nearest valid side row (never a made-up default)
      const sideValidRows = [];
      for (let y = 0; y < H; y++) if (rawSideValid[y]) sideValidRows.push(y);

      const filledSideMin = new Float32Array(H);
      const filledSideMax = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        if (rawSideValid[y] || sideValidRows.length === 0) {
          filledSideMin[y] = sideValidRows.length ? rawSideMin[y] : W * 0.36;
          filledSideMax[y] = sideValidRows.length ? rawSideMax[y] : W * 0.64;
          continue;
        }
        let best = sideValidRows[0], bestD = Math.abs(y - best);
        for (let k = 1; k < sideValidRows.length; k++) {
          const d = Math.abs(y - sideValidRows[k]);
          if (d < bestD) { bestD = d; best = sideValidRows[k]; }
        }
        filledSideMin[y] = rawSideMin[best];
        filledSideMax[y] = rawSideMax[best];
      }

      // Light vertical smoothing only (keeps the profile faithful, removes pixel steps)
      const sideMin = new Float32Array(H);
      const sideMax = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        let sumMin = 0, sumMax = 0, cnt = 0;
        for (let dy = -8; dy <= 8; dy++) {
          const ny = Math.min(H - 1, Math.max(0, y + dy));
          sumMin += filledSideMin[ny];
          sumMax += filledSideMax[ny];
          cnt++;
        }
        sideMin[y] = sumMin / cnt;
        sideMax[y] = sumMax / cnt;
      }

      // ------------------------------------------------------------------
      // 2) Soft Alpha Cut-Out of photo.png
      // ------------------------------------------------------------------
      const cutoutCanvas = document.createElement('canvas');
      cutoutCanvas.width = 1920;
      cutoutCanvas.height = 1080;
      const cutCtx = cutoutCanvas.getContext('2d');
      cutCtx.drawImage(photoImg, 0, 0, 1920, 1080);
      const cutImg = cutCtx.getImageData(0, 0, 1920, 1080);
      const cd = cutImg.data;
      for (let i = 0; i < cd.length; i += 4) {
        const luma = 0.299 * cd[i] + 0.587 * cd[i + 1] + 0.114 * cd[i + 2];
        const alpha = Math.min(1, Math.max(0, (luma - 5) / 20));
        cd[i + 3] = Math.round(alpha * 255);
      }
      cutCtx.putImageData(cutImg, 0, 0);

      await yieldToUI();

      // ------------------------------------------------------------------
      // 3) Front bust & clay silhouette bounds per row
      // ------------------------------------------------------------------
      const rawClayMin = new Float32Array(H);
      const rawClayMax = new Float32Array(H);
      const rawBustMin = new Float32Array(H);
      const rawBustMax = new Float32Array(H);
      const validRow   = new Uint8Array(H);

      for (let y = 0; y < H; y++) {
        let cMin = W, cMax = 0;
        let bMin = W, bMax = 0;
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const pLuma = 0.299 * photoData[i] + 0.587 * photoData[i + 1] + 0.114 * photoData[i + 2];
          const cGray = (frontData[i] + frontData[i + 1] + frontData[i + 2]) / 3;

          if (cGray < 242) {
            if (x < cMin) cMin = x;
            if (x > cMax) cMax = x;
          }
          if (pLuma > 9 || cGray < 242) {
            if (x < bMin) bMin = x;
            if (x > bMax) bMax = x;
          }
        }

        if (bMax > bMin + 8) {
          validRow[y] = 1;
          rawBustMin[y] = bMin;
          rawBustMax[y] = bMax;
          rawClayMin[y] = cMax > cMin + 8 ? cMin : bMin;
          rawClayMax[y] = cMax > cMin + 8 ? cMax : bMax;
        }
      }

      const bustMin = new Float32Array(H);
      const bustMax = new Float32Array(H);
      const clayMin = new Float32Array(H);
      const clayMax = new Float32Array(H);

      for (let y = 0; y < H; y++) {
        let sbMin = 0, sbMax = 0, scMin = 0, scMax = 0, cnt = 0;
        for (let dy = -12; dy <= 12; dy++) {
          const ny = Math.min(H - 1, Math.max(0, y + dy));
          if (validRow[ny]) {
            sbMin += rawBustMin[ny];
            sbMax += rawBustMax[ny];
            scMin += rawClayMin[ny];
            scMax += rawClayMax[ny];
            cnt++;
          }
        }
        if (cnt > 0) {
          bustMin[y] = sbMin / cnt;
          bustMax[y] = sbMax / cnt;
          clayMin[y] = scMin / cnt;
          clayMax[y] = scMax / cnt;
        }
      }

      function sampleFrontClay(cx, cy, yRow) {
        const cLeft = clayMin[yRow] + 3;
        const cRight = clayMax[yRow] - 3;
        const clampedX = Math.max(0, Math.min(W - 1, Math.round(Math.max(cLeft, Math.min(cRight, cx)))));
        const clampedY = Math.max(0, Math.min(H - 1, Math.round(cy)));
        const idx = (clampedY * W + clampedX) * 4;
        return Math.min(234, (frontData[idx] + frontData[idx + 1] + frontData[idx + 2]) / 3);
      }

      function sampleSideClay(sx, sy, yRow) {
        const sLeft = sideMin[yRow] + 3;
        const sRight = sideMax[yRow] - 3;
        const clampedX = Math.max(0, Math.min(W - 1, Math.round(Math.max(sLeft, Math.min(sRight, sx)))));
        const clampedY = Math.max(0, Math.min(H - 1, Math.round(sy)));
        const idx = (clampedY * W + clampedX) * 4;
        return Math.min(234, (sideData[idx] + sideData[idx + 1] + sideData[idx + 2]) / 3);
      }

      setProgress(88, 'Building Solid 3D Surface');
      await yieldToUI();

      // ------------------------------------------------------------------
      // 4) Strict depth profile. For every row the cross-section of the bust
      //    is a closed rounded (super-elliptic) loop:
      //      width  = front bust silhouette
      //      depth  = side-profile silhouette (front surface -> back surface)
      //    Depth is measured toward the camera relative to zRef, the mean
      //    centre of the side profile, so the bust pivots around its own centre.
      //    Because the loop is closed, the left/right shoulder walls are real
      //    surfaces that get their own points: nothing can end up hollow.
      // ------------------------------------------------------------------
      let zRef = 0, zCnt = 0;
      for (let y = 0; y < H; y++) {
        if (!validRow[y]) continue;
        zRef += (sideMin[y] + sideMax[y]) * 0.5;
        zCnt++;
      }
      zRef = zCnt ? zRef / zCnt : W * 0.5;

      const zFrontPx = new Float32Array(H);   // front surface depth (px toward camera)
      const zBackPx  = new Float32Array(H);   // back surface depth
      for (let y = 0; y < H; y++) {
        let zf = zRef - sideMin[y];
        let zb = zRef - sideMax[y];
        if (zf - zb < 24) {                   // never allow a paper-thin row
          const mid = (zf + zb) * 0.5;
          zf = mid + 12;
          zb = mid - 12;
        }
        zFrontPx[y] = zf;
        zBackPx[y] = zb;
      }

      const slopeFront = new Float32Array(H);
      const slopeBack  = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        const y0 = Math.max(0, y - 3), y1 = Math.min(H - 1, y + 3);
        const span = Math.max(1, y1 - y0);
        slopeFront[y] = Math.max(-1.5, Math.min(1.5, (zFrontPx[y1] - zFrontPx[y0]) / span));
        slopeBack[y]  = Math.max(-1.5, Math.min(1.5, (zBackPx[y1]  - zBackPx[y0])  / span));
      }

      const K = 256;                 // samples around each cross-section
      const PHI_MAX = 2.0;           // ~115 deg: front + both flanks + a little wrap-around
      const phiTab = new Float32Array(K);
      const sinTab = new Float32Array(K);
      const cosTab = new Float32Array(K);
      for (let k = 0; k < K; k++) {
        const phi = -PHI_MAX + (2 * PHI_MAX * k) / (K - 1);
        phiTab[k] = phi;
        sinTab[k] = Math.sin(phi);
        cosTab[k] = Math.cos(phi);
      }

      const rowCum  = new Float32Array(H * K);   // cumulative arc length along the cross-section (px)
      const rowLen  = new Float32Array(H);
      const rowP    = new Float32Array(H);       // super-ellipse exponent (rounder head, fuller shoulders)
      const rowBC   = new Float32Array(H);       // bust centre x (px)
      const rowBH   = new Float32Array(H);       // bust half width (px)
      const rowZc   = new Float32Array(H);       // depth centre (px)
      const rowCH   = new Float32Array(H);       // depth half extent (px)

      let totalSurfaceArea = 0;

      for (let y = 0; y < H; y++) {
        if (!validRow[y]) continue;

        const bMin = bustMin[y];
        const bMax = bustMax[y];
        rowBC[y] = (bMin + bMax) * 0.5;
        rowBH[y] = Math.max(12, (bMax - bMin) * 0.5);
        rowZc[y] = (zFrontPx[y] + zBackPx[y]) * 0.5;
        rowCH[y] = Math.max(10, (zFrontPx[y] - zBackPx[y]) * 0.5);

        const torsoBlend = Math.max(0, Math.min(1, (y - H * 0.44) / (H * 0.16)));
        const p = 2.0 + torsoBlend * 1.15;
        rowP[y] = p;
        const e = 2 / p;

        let prevX = 0, prevZ = 0, cum = 0;
        const base = y * K;
        for (let k = 0; k < K; k++) {
          const x = rowBH[y] * spow(sinTab[k], e);
          const z = rowZc[y] + rowCH[y] * spow(cosTab[k], e);
          if (k > 0) cum += Math.hypot(x - prevX, z - prevZ);
          rowCum[base + k] = cum;
          prevX = x;
          prevZ = z;
        }
        rowLen[y] = cum;
        totalSurfaceArea += cum;

        if (y % 90 === 89) await yieldToUI();
      }

      function phiAtArc(y, s) {
        const base = y * K;
        let lo = 0, hi = K - 1;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (rowCum[base + mid] < s) lo = mid; else hi = mid;
        }
        const c0 = rowCum[base + lo];
        const c1 = rowCum[base + hi];
        const t = c1 > c0 ? (s - c0) / (c1 - c0) : 0;
        return phiTab[lo] + (phiTab[hi] - phiTab[lo]) * t;
      }

      setProgress(91, 'Distributing 78,000 Volumetric Dots');
      await yieldToUI();

      // ------------------------------------------------------------------
      // 5) Uniform, jittered point distribution over the whole visible 3D
      //    surface (front, shoulder flanks, ears, hood sides) in
      //    (row, arc-length) space, so density is even everywhere.
      // ------------------------------------------------------------------
      const N = TARGET_DOT_COUNT;
      const cell = Math.sqrt(totalSurfaceArea / (N * 1.04));
      const rawPoints = [];

      for (let fy = 3.5, band = 0; fy < H - 3.5; fy += cell, band++) {
        const iy0 = Math.round(fy);
        if (!validRow[iy0]) continue;

        const L = rowLen[iy0];
        for (let s = (band % 2) * cell * 0.5 + cell * 0.25; s < L; s += cell) {
          const js = Math.max(0, Math.min(L, s + (Math.random() - 0.5) * cell * 1.1));
          const jy = Math.max(3, Math.min(H - 4, fy + (Math.random() - 0.5) * cell * 1.1));
          const ry = Math.max(0, Math.min(H - 1, Math.round(jy)));
          if (!validRow[ry]) continue;

          const a   = rowBH[ry];
          const ch  = rowCH[ry];
          const zc  = rowZc[ry];
          const bC  = rowBC[ry];
          const p   = rowP[ry];
          const e   = 2 / p;
          const e1  = 2 * (p - 1) / p;

          const phi = phiAtArc(ry, js * (rowLen[ry] / Math.max(1e-6, L)));
          const sn = Math.sin(phi);
          const cs = Math.cos(phi);

          // Point on the closed cross-section (px relative to bust centre / zRef)
          let xRel = a * spow(sn, e);
          let zRel = zc + ch * spow(cs, e);

          // Outward cross-section normal (gradient of the super-ellipse)
          let gx = spow(sn, e1) / a;
          let gz = spow(cs, e1) / ch;
          const gLen = Math.hypot(gx, gz) || 1;
          gx /= gLen;
          gz /= gLen;

          // --- Clay detail: front clay on the face-on surface, side clay on the flanks ---
          const u = Math.max(-0.99, Math.min(0.99, xRel / a));
          const mappedClayX = (clayMin[ry] + clayMax[ry]) * 0.5 + u * Math.max(12, (clayMax[ry] - clayMin[ry]) * 0.5);
          const fGray  = sampleFrontClay(mappedClayX, jy, ry);
          const fRight = sampleFrontClay(mappedClayX + 2.5, jy, ry);
          const fLeft  = sampleFrontClay(mappedClayX - 2.5, jy, ry);
          const fDown  = sampleFrontClay(mappedClayX, jy + 2.5, Math.min(H - 1, ry + 2));
          const fUp    = sampleFrontClay(mappedClayX, jy - 2.5, Math.max(0, ry - 2));
          const fMean  = (fRight + fLeft + fDown + fUp) * 0.25;
          const fGrad  = Math.min(1.0, (Math.abs(fRight - fLeft) + Math.abs(fDown - fUp)) / 52.0);
          const fUnsharp = Math.max(-0.20, Math.min(0.35, (fMean - fGray) / 40.0));

          // The side image is sampled at this point's exact depth (front surface = sMin)
          const sideX  = zRef - zRel;
          const sGray  = sampleSideClay(sideX, jy, ry);
          const sRight = sampleSideClay(sideX + 2.5, jy, ry);
          const sLeft  = sampleSideClay(sideX - 2.5, jy, ry);
          const sDown  = sampleSideClay(sideX, jy + 2.5, Math.min(H - 1, ry + 2));
          const sUp    = sampleSideClay(sideX, jy - 2.5, Math.max(0, ry - 2));
          const sMean  = (sRight + sLeft + sDown + sUp) * 0.25;
          const sGrad  = Math.min(1.0, (Math.abs(sRight - sLeft) + Math.abs(sDown - sUp)) / 52.0);
          const sUnsharp = Math.max(-0.20, Math.min(0.35, (sMean - sGray) / 40.0));

          const wSide = smoothstep01(0.28, 0.85, Math.abs(gx));
          const combinedGrad    = fGrad * (1 - wSide) + sGrad * wSide;
          const combinedUnsharp = fUnsharp * (1 - wSide) + sUnsharp * wSide;
          const combinedGray    = fGray * (1 - wSide) + sGray * wSide;
          const combinedMean    = fMean * (1 - wSide) + sMean * wSide;

          // Tiny relief along the normal (max 1.5px) - the depth profile stays authoritative
          const relief = Math.max(-1.5, Math.min(1.5, (combinedGray - combinedMean) * 0.18));
          xRel += gx * relief;
          zRel += gz * relief;

          // Full 3D normal: cross-section normal + vertical tilt from the side profile slope
          const slope = gz >= 0 ? slopeFront[ry] : slopeBack[ry];
          let nx = gx;
          let ny = slope * gz;
          let nz = gz;
          const nLen = Math.hypot(nx, ny, nz) || 1;
          nx /= nLen; ny /= nLen; nz /= nLen;

          // Rich, solid baseline brightness over the whole surface, flanks included
          const facingDome = Math.max(0, gz);
          const baseSolid = 0.72 + 0.16 * facingDome;
          const detailBoost = (1.0 - (combinedGray / 245.0) * 0.32) * 0.22 + combinedGrad * 0.42 + combinedUnsharp * 0.26;
          const brightness = Math.max(0.56, Math.min(1.0, baseSolid * 0.68 + detailBoost * 0.55));

          const xPx = bC + xRel;
          const ix = Math.max(0, Math.min(W - 1, Math.round(xPx)));
          const iy = Math.max(0, Math.min(H - 1, Math.round(jy)));
          const cIdx = (iy * W + ix) * 4;

          rawPoints.push({
            x: ((xPx / W) - 0.5) * (16 / 9),
            y: 0.5 - (jy / H),
            z: zRel / H,
            nx, ny, nz,
            brightness,
            r: photoData[cIdx] / 255,
            g: photoData[cIdx + 1] / 255,
            b: photoData[cIdx + 2] / 255
          });
        }

        if (band % 20 === 19) {
          setProgress(91 + 7 * (fy / H), null);
          await yieldToUI();
        }
      }

      // Shuffle so any truncation thins the surface uniformly
      for (let i = rawPoints.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = rawPoints[i];
        rawPoints[i] = rawPoints[j];
        rawPoints[j] = tmp;
      }

      const positions      = new Float32Array(N * 3);
      const startPositions = new Float32Array(N * 3);
      const normals        = new Float32Array(N * 3);
      const photoColors    = new Float32Array(N * 3);
      const brightnessArr  = new Float32Array(N);
      const randomArr      = new Float32Array(N);

      const rLen = rawPoints.length;
      for (let i = 0; i < N; i++) {
        const pt = rawPoints[i % rLen];

        positions[i * 3]     = pt.x;
        positions[i * 3 + 1] = pt.y;
        positions[i * 3 + 2] = pt.z;

        // Smooth holographic 3D depth dispersion start coordinates
        startPositions[i * 3]     = pt.x * 1.08 + (Math.random() - 0.5) * 0.06;
        startPositions[i * 3 + 1] = pt.y + (Math.random() - 0.5) * 0.06;
        startPositions[i * 3 + 2] = pt.z + 0.35 + Math.random() * 0.45;

        normals[i * 3]     = pt.nx;
        normals[i * 3 + 1] = pt.ny;
        normals[i * 3 + 2] = pt.nz;

        photoColors[i * 3]     = pt.r;
        photoColors[i * 3 + 1] = pt.g;
        photoColors[i * 3 + 2] = pt.b;

        brightnessArr[i] = pt.brightness;
        randomArr[i]     = Math.random();
      }

      setProgress(100, 'Ready');
      await Loader.finished;     // let the eased progress reach 100% before revealing
      await sleep(260);

      preloader.classList.add('hidden');
      setTimeout(Loader.stop, 900);
      startWebGL(cutoutCanvas, {
        positions,
        startPositions,
        normals,
        photoColors,
        brightnessArr,
        randomArr
      });
    }

    function startWebGL(cutoutCanvas, dotData) {
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();

      // Orthographic camera with portrait ~12% larger than fit-to-height
      const viewHeight = 1.0 / 1.12;
      const aspect = window.innerWidth / window.innerHeight;
      const camera = new THREE.OrthographicCamera(
        (-viewHeight * aspect) / 2,
        (viewHeight * aspect) / 2,
        viewHeight / 2,
        -viewHeight / 2,
        -10,
        10
      );
      camera.position.z = 2;

      // Cut-out Photo Mesh (opens via grid of growing circles on Reveal)
      const photoTex = new THREE.CanvasTexture(cutoutCanvas);
      photoTex.minFilter = THREE.LinearFilter;
      photoTex.magFilter = THREE.LinearFilter;

      const photoGeo = new THREE.PlaneGeometry(16 / 9, 1, 1, 1);
      const photoMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uPhotoTex: { value: photoTex },
          uReveal: { value: 0.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uPhotoTex;
          uniform float uReveal;
          varying vec2 vUv;

          void main() {
            if (uReveal <= 0.001) discard;
            vec4 tex = texture2D(uPhotoTex, vUv);
            if (tex.a <= 0.01) discard;

            float sweepY = 1.05 - uReveal * 1.25;
            float localP = clamp((vUv.y - sweepY) / 0.20, 0.0, 1.0);
            if (localP <= 0.0) discard;

            vec2 grid = fract(vUv * vec2(136.0, 76.0)) - 0.5;
            float dist = length(grid);
            float maxR = localP * 0.78;
            float circleMask = 1.0 - smoothstep(maxR - 0.05, maxR + 0.02, dist);

            gl_FragColor = vec4(tex.rgb, tex.a * circleMask);
          }
        `
      });
      const photoMesh = new THREE.Mesh(photoGeo, photoMat);
      photoMesh.position.z = -0.02;
      scene.add(photoMesh);

      // 78,000 Deep Red Dots Point Cloud
      const dotGeo = new THREE.BufferGeometry();
      dotGeo.setAttribute('position', new THREE.BufferAttribute(dotData.positions, 3));
      dotGeo.setAttribute('aStartPos', new THREE.BufferAttribute(dotData.startPositions, 3));
      dotGeo.setAttribute('aNormal', new THREE.BufferAttribute(dotData.normals, 3));
      dotGeo.setAttribute('aPhotoColor', new THREE.BufferAttribute(dotData.photoColors, 3));
      dotGeo.setAttribute('aBrightness', new THREE.BufferAttribute(dotData.brightnessArr, 1));
      dotGeo.setAttribute('aRandom', new THREE.BufferAttribute(dotData.randomArr, 1));

      const dotMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uIntro: { value: 0.0 },
          uIntroSweep: { value: 0.65 },
          uReveal: { value: 0.0 },
          uRotY: { value: 0.0 },
          uRotX: { value: 0.0 },
          uCursor: { value: new THREE.Vector2(0.0, 0.0) },
          uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
        },
        vertexShader: `
          attribute vec3 aStartPos;
          attribute vec3 aNormal;
          attribute vec3 aPhotoColor;
          attribute float aBrightness;
          attribute float aRandom;

          uniform float uIntro;
          uniform float uIntroSweep;
          uniform float uReveal;
          uniform float uRotY;
          uniform float uRotX;
          uniform vec2 uCursor;
          uniform float uPixelRatio;

          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec3 restPos = position;

            // Smooth top-to-bottom 3D volumetric scan-in assembly
            float verticalOrder = clamp(0.5 - restPos.y, 0.0, 1.0) * 0.32 + aRandom * 0.14;
            float flyT = clamp((uIntro - verticalOrder) / 0.54, 0.0, 1.0);
            float easeFly = 1.0 - pow(1.0 - flyT, 3.0);

            // Smooth head-to-shoulder turn weight
            float headWeight = smoothstep(-0.45, 0.15, restPos.y);
            float weight = 0.28 + 0.72 * headWeight;

            float activeTrack = 1.0 - smoothstep(0.0, 0.16, uReveal);
            float ry = uRotY * weight * activeTrack;
            float rx = uRotX * weight * 0.65 * activeTrack;

            float cy = cos(ry), sy = sin(ry);
            vec3 p = restPos;
            p.x = restPos.x * cy + restPos.z * sy;
            p.z = -restPos.x * sy + restPos.z * cy;

            float cx = cos(rx), sx = sin(rx);
            float py = p.y * cx - p.z * sx;
            float pz = p.y * sx + p.z * cx;
            p.y = py;
            p.z = pz;

            // Top-to-bottom Reveal sweep
            float sweepY = 1.05 - uReveal * 1.25;
            float dotSweep = clamp(((restPos.y + 0.5) - sweepY) / 0.18, 0.0, 1.0);

            // Above the band, dots press flat onto the photo
            p = mix(p, vec3(restPos.x, restPos.y, 0.0), dotSweep);

            vec3 finalPos = mix(aStartPos, p, easeFly);

            vec3 n = aNormal;
            n.x = aNormal.x * cy + aNormal.z * sy;
            n.z = -aNormal.x * sy + aNormal.z * cy;

            // Wrapped key light keeps the shoulder flanks lit, plus a soft side rim
            vec3 keyDir = normalize(vec3(0.0, 0.22, 0.97));
            float diff = clamp(dot(n, keyDir) * 0.55 + 0.45, 0.0, 1.0);
            float sideRim = pow(1.0 - clamp(n.z, 0.0, 1.0), 1.8) * 0.52;

            // Surface facing: dots on the far side of the bust fade out, so the
            // bust reads as one solid volume (no see-through back wall)
            float facing = smoothstep(-0.10, 0.22, n.z);
            // Surfaces seen edge-on stack up in projection; ease them down to keep density even
            float density = mix(0.55, 1.0, smoothstep(0.0, 0.65, n.z));

            float cursorDist = length(finalPos.xy - uCursor);
            float cursorBoost = smoothstep(0.52, 0.0, cursorDist) * 0.45 * activeTrack;

            // Laser scan band sweeping down the bust during intro
            float introBand = exp(-pow((restPos.y - uIntroSweep) * 10.5, 2.0)) * 0.78;

            // Deep vibrant crimson across the entire bust and shoulders
            vec3 crimson = vec3(0.68, 0.032, 0.048);
            float shade = aBrightness * (0.76 + 0.24 * diff) + sideRim * 0.44 + cursorBoost + introBand;
            vec3 baseDotColor = crimson * shade * 1.18;

            // During Reveal band, dots take photo colors and fade out
            float bandEdge = exp(-pow(((restPos.y + 0.5) - sweepY) * 14.0, 2.0)) * step(0.001, uReveal);
            vec3 finalCol = mix(baseDotColor, aPhotoColor * 0.88, dotSweep);
            finalCol += crimson * bandEdge * 1.15;

            vColor = finalCol;
            vAlpha = easeFly * (1.0 - smoothstep(0.28, 0.95, dotSweep)) * (0.58 + 0.36 * aBrightness) * facing * density;

            gl_Position = projectionMatrix * modelViewMatrix * vec4(finalPos, 1.0);

            float ptSize = mix(2.3, 4.3, aBrightness) * (0.88 + 0.24 * aRandom);
            gl_PointSize = ptSize * uPixelRatio;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;
            float softCircle = pow(1.0 - r, 1.5);
            gl_FragColor = vec4(vColor * softCircle, vAlpha * softCircle);
          }
        `
      });

      const dotCloud = new THREE.Points(dotGeo, dotMat);
      scene.add(dotCloud);

      // Faint Drifting Dust
      const dustCount = 220;
      const dustPositions = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount; i++) {
        dustPositions[i * 3]     = (Math.random() - 0.5) * 2.2;
        dustPositions[i * 3 + 1] = (Math.random() - 0.5) * 1.3;
        dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      }
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
      const dustMat = new THREE.PointsMaterial({
        color: new THREE.Color(0.68, 0.032, 0.048),
        size: 2.0,
        transparent: true,
        opacity: 0.22,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const dustParticles = new THREE.Points(dustGeo, dustMat);
      scene.add(dustParticles);

      // Cursor & Touch Tracking + Idle Drift
      let targetRotY = 0, targetRotX = 0;
      let currentRotY = 0, currentRotX = 0;
      let cursorX = 0, cursorY = 0;
      let hasMoved = false;

      function updatePointer(clientX, clientY) {
        hasMoved = true;
        const nx = (clientX / window.innerWidth) * 2 - 1;
        const ny = -(clientY / window.innerHeight) * 2 + 1;
        targetRotY = nx * 0.5236; // 30 degrees in radians
        targetRotX = -ny * 0.24;
        cursorX = nx * (viewHeight * (window.innerWidth / window.innerHeight)) * 0.5;
        cursorY = ny * (viewHeight * 0.5);
      }

      window.addEventListener('pointermove', (e) => updatePointer(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      // Reveal / Back to dots toggle
      let isRevealed = false;
      let revealTarget = 0.0;
      let revealCurrent = 0.0;

      revealBtn.addEventListener('click', () => {
        isRevealed = !isRevealed;
        revealTarget = isRevealed ? 1.0 : 0.0;
        revealBtn.textContent = isRevealed ? 'Back to dots' : 'Reveal';
      });

      uiControls.classList.add('ready');

      const startTime = performance.now();
      let lastTime = startTime;

      function renderLoop(now) {
        requestAnimationFrame(renderLoop);
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const elapsed = (now - startTime) / 1000;

        // Smooth 3D volumetric scan-in assembly
        dotMat.uniforms.uIntro.value = Math.min(1.0, elapsed / 1.15);
        if (elapsed < 1.8) {
          const t = elapsed / 1.8;
          dotMat.uniforms.uIntroSweep.value = 0.55 - t * 1.15;
        } else {
          dotMat.uniforms.uIntroSweep.value = -2.0;
        }

        // Idle drift before first cursor move
        if (!hasMoved && revealCurrent < 0.05) {
          targetRotY = Math.sin(elapsed * 0.85) * 0.14;
          targetRotX = Math.cos(elapsed * 0.6) * 0.05;
        }

        // After full reveal, photo stays completely still
        if (revealCurrent >= 0.999) {
          currentRotY = 0;
          currentRotX = 0;
        } else {
          currentRotY += (targetRotY - currentRotY) * Math.min(1.0, dt * 5.8);
          currentRotX += (targetRotX - currentRotX) * Math.min(1.0, dt * 5.8);
        }

        dotMat.uniforms.uRotY.value = currentRotY;
        dotMat.uniforms.uRotX.value = currentRotX;
        dotMat.uniforms.uCursor.value.set(cursorX, cursorY);

        // 3.6-second Reveal sweep
        if (Math.abs(revealTarget - revealCurrent) > 0.0005) {
          const step = dt / REVEAL_DURATION;
          revealCurrent = revealCurrent < revealTarget
            ? Math.min(revealTarget, revealCurrent + step)
            : Math.max(revealTarget, revealCurrent - step);

          dotMat.uniforms.uReveal.value = revealCurrent;
          photoMat.uniforms.uReveal.value = revealCurrent;

          // Banner transitions smoothly from legible grey to crimson in step with the band
          const m = revealCurrent;
          const rTop = Math.round(185 + (190 - 185) * m);
          const gTop = Math.round(185 * (1 - m) + 12 * m);
          const bTop = Math.round(195 * (1 - m) + 18 * m);

          const rMid = Math.round(125 + (135 - 125) * m);
          const gMid = Math.round(125 * (1 - m) + 8 * m);
          const bMid = Math.round(135 * (1 - m) + 12 * m);

          bannerText.style.background = `linear-gradient(180deg, rgba(${rTop}, ${gTop}, ${bTop}, ${0.52 + m * 0.28}) 0%, rgba(${rMid}, ${gMid}, ${bMid}, ${0.36 + m * 0.18}) 55%, rgba(${Math.round(rMid * 0.5)}, 14, 18, 0.22) 85%, rgba(12, 8, 10, 0.09) 100%)`;
          bannerText.style.webkitBackgroundClip = 'text';
          bannerText.style.backgroundClip = 'text';
        }

        // Faint drifting dust (paused when photo is revealed)
        if (revealCurrent < 0.99) {
          dustParticles.rotation.y = elapsed * 0.018;
          dustParticles.position.y = Math.sin(elapsed * 0.35) * 0.018;
          dustMat.opacity = 0.22 * (1.0 - revealCurrent);
        } else {
          dustMat.opacity = 0.0;
        }

        renderer.render(scene, camera);
      }

      requestAnimationFrame(renderLoop);

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        const asp = w / h;
        camera.left = (-viewHeight * asp) / 2;
        camera.right = (viewHeight * asp) / 2;
        camera.top = viewHeight / 2;
        camera.bottom = -viewHeight / 2;
        camera.updateProjectionMatrix();
        dotMat.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
      });
    }

    boot();
  </script>
</body>
</html>
