<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SOURCEIUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #040405;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      touch-action: none;
    }

    /* Full-Width Anton Backdrop Banner */
    #banner-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    #banner-text {
      font-family: 'Anton', sans-serif;
      font-size: 21.5vw;
      line-height: 0.84;
      letter-spacing: -0.015em;
      text-transform: uppercase;
      white-space: nowrap;
      width: 100vw;
      text-align: center;
      transform: translateY(-2%);
      background: linear-gradient(
        180deg,
        rgba(140, 140, 148, 0.32) 0%,
        rgba(54, 54, 60, 0.11) 64%,
        rgba(4, 4, 5, 0.0) 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      /* Dimmed smoothly behind the bust */
      -webkit-mask-image: radial-gradient(
        ellipse 24% 44% at 50% 54%,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(0, 0, 0, 0.65) 62%,
        rgba(0, 0, 0, 1) 100%
      );
      mask-image: radial-gradient(
        ellipse 24% 44% at 50% 54%,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(0, 0, 0, 0.65) 62%,
        rgba(0, 0, 0, 1) 100%
      );
    }

    /* WebGL Canvas */
    #webgl-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 2;
      display: block;
    }

    /* Subtle Film Grain */
    #film-grain {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.038;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* Dark Red Ring Preloader */
    #preloader {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #040405;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .ring-box {
      position: relative;
      width: 116px;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(163, 9, 14, 0.14);
      stroke-width: 2.5;
    }

    .ring-bar {
      fill: none;
      stroke: rgb(163, 9, 14);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 339.29;
      stroke-dashoffset: 339.29;
      transition: stroke-dashoffset 0.1s linear;
    }

    #progress-pct {
      position: absolute;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgb(163, 9, 14);
      font-variant-numeric: tabular-nums;
    }

    /* Bottom Reveal Button */
    #ui-controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #ui-controls.ready {
      opacity: 1;
      pointer-events: auto;
    }

    #reveal-btn {
      appearance: none;
      border: 1px solid rgba(163, 9, 14, 0.35);
      background: rgba(12, 6, 7, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #f0e6e7;
      padding: 9px 26px;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65);
    }

    #reveal-btn:hover {
      border-color: rgba(195, 18, 25, 0.85);
      background: rgba(28, 7, 9, 0.88);
      box-shadow: 0 0 20px rgba(163, 9, 14, 0.4);
    }
  </style>
</head>
<body>

  <!-- Background Word in Anton -->
  <div id="banner-wrap">
    <div id="banner-text">SOURCEIUM</div>
  </div>

  <!-- Full-Screen WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Subtle Film Grain -->
  <div id="film-grain"></div>

  <!-- Preloader: Dark Red Ring + Real Percentage Only -->
  <div id="preloader">
    <div class="ring-box">
      <svg class="ring-svg" viewBox="0 0 116 116">
        <circle class="ring-track" cx="58" cy="58" r="54"></circle>
        <circle class="ring-bar" id="ring-bar" cx="58" cy="58" r="54"></circle>
      </svg>
      <div id="progress-pct">0%</div>
    </div>
  </div>

  <!-- Reveal Toggle Button -->
  <div id="ui-controls">
    <button id="reveal-btn">Reveal</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const TARGET_DOT_COUNT = 78000;
    const REVEAL_DURATION = 3.6;

    const ringBar = document.getElementById('ring-bar');
    const progressPct = document.getElementById('progress-pct');
    const preloader = document.getElementById('preloader');
    const uiControls = document.getElementById('ui-controls');
    const revealBtn = document.getElementById('reveal-btn');
    const bannerText = document.getElementById('banner-text');

    function setProgress(pct) {
      const clamped = Math.max(0, Math.min(100, Math.round(pct)));
      progressPct.textContent = clamped + '%';
      const circumference = 339.29;
      ringBar.style.strokeDashoffset = circumference - (clamped / 100) * circumference;
    }

    function fetchImageWithProgress(paths, onProgress) {
      return new Promise((resolve, reject) => {
        let index = 0;

        function attempt() {
          if (index >= paths.length) {
            reject(new Error('Failed to load image'));
            return;
          }
          const url = paths[index++];
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.responseType = 'blob';

          xhr.onprogress = (e) => {
            if (e.lengthComputable && onProgress) {
              onProgress(e.loaded / e.total);
            }
          };

          xhr.onload = () => {
            if (xhr.status === 200 || xhr.status === 0) {
              const blobUrl = URL.createObjectURL(xhr.response);
              const img = new Image();
              img.onload = () => {
                URL.revokeObjectURL(blobUrl);
                if (onProgress) onProgress(1);
                resolve(img);
              };
              img.onerror = attempt;
              img.src = blobUrl;
            } else {
              attempt();
            }
          };

          xhr.onerror = attempt;
          xhr.send();
        }

        attempt();
      });
    }

    async function boot() {
      const p = [0, 0, 0];
      const updatePct = () => setProgress(((p[0] + p[1] + p[2]) / 3) * 74);

      const [photoImg, frontImg, sideImg] = await Promise.all([
        fetchImageWithProgress(['/photo.png', './photo.png', 'photo.png'], (v) => { p[0] = v; updatePct(); }),
        fetchImageWithProgress(['/clay-front.png', './clay-front.png', 'clay-front.png'], (v) => { p[1] = v; updatePct(); }),
        fetchImageWithProgress(['/clay-side.png', './clay-side.png', 'clay-side.png'], (v) => { p[2] = v; updatePct(); })
      ]);

      setProgress(82);
      requestAnimationFrame(() => processSculpture(photoImg, frontImg, sideImg));
    }

    function processSculpture(photoImg, frontImg, sideImg) {
      const W = 960;
      const H = 540;

      function getPixels(img, w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        return ctx.getImageData(0, 0, w, h).data;
      }

      const photoData = getPixels(photoImg, W, H);
      const frontData = getPixels(frontImg, W, H);
      const sideData  = getPixels(sideImg, W, H);

      setProgress(88);

      // 1) Measure 90-degree side profile depth curve per row Y
      const rawSideSpan = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        let minX = W, maxX = 0;
        for (let x = 0; x < W; x++) {
          const i = (y * W + x) * 4;
          const gray = (sideData[i] + sideData[i + 1] + sideData[i + 2]) / 3;
          if (gray < 232) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
        rawSideSpan[y] = maxX > minX ? (maxX - minX) / W : 0.20;
      }

      // Smooth side profile vertically so there are zero horizontal ledges
      const sideSpan = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        let sum = 0, cnt = 0;
        for (let dy = -12; dy <= 12; dy++) {
          const yy = Math.min(H - 1, Math.max(0, y + dy));
          sum += rawSideSpan[yy];
          cnt++;
        }
        sideSpan[y] = sum / cnt;
      }

      // 2) Precompute smoothed clay luminance buffer for clean local-contrast extraction
      const clayLuma = new Float32Array(W * H);
      const clayMask = new Uint8Array(W * H);
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          const idx = y * W + x;
          const i = idx * 4;
          const cGray = (frontData[i] + frontData[i + 1] + frontData[i + 2]) / 3;
          const pLuma = 0.299 * photoData[i] + 0.587 * photoData[i + 1] + 0.114 * photoData[i + 2];
          clayLuma[idx] = cGray;
          // Separate bust from white background (grey below 234 or inside photo silhouette)
          if (cGray < 234 || pLuma > 10) {
            clayMask[idx] = 1;
          }
        }
      }

      // Compute row bounds and smooth them vertically to avoid any silhouette steps
      const rawMinX = new Float32Array(H);
      const rawMaxX = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        let minX = W, maxX = 0;
        for (let x = 0; x < W; x++) {
          if (clayMask[y * W + x]) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
          }
        }
        rawMinX[y] = minX;
        rawMaxX[y] = maxX;
      }

      const smoothCenterX = new Float32Array(H);
      const smoothHalfW   = new Float32Array(H);
      for (let y = 0; y < H; y++) {
        let sumC = 0, sumW = 0, cnt = 0;
        for (let dy = -8; dy <= 8; dy++) {
          const yy = Math.min(H - 1, Math.max(0, y + dy));
          if (rawMaxX[yy] > rawMinX[yy]) {
            sumC += (rawMinX[yy] + rawMaxX[yy]) * 0.5;
            sumW += (rawMaxX[yy] - rawMinX[yy]) * 0.5;
            cnt++;
          }
        }
        smoothCenterX[y] = cnt > 0 ? sumC / cnt : W * 0.5;
        smoothHalfW[y]   = cnt > 0 ? Math.max(10, sumW / cnt) : W * 0.2;
      }

      // 3) Create soft alpha cut-out of photo.png
      const cutoutCanvas = document.createElement('canvas');
      cutoutCanvas.width = 1920;
      cutoutCanvas.height = 1080;
      const cutCtx = cutoutCanvas.getContext('2d');
      cutCtx.drawImage(photoImg, 0, 0, 1920, 1080);
      const cutImg = cutCtx.getImageData(0, 0, 1920, 1080);
      const cd = cutImg.data;
      for (let i = 0; i < cd.length; i += 4) {
        const luma = 0.299 * cd[i] + 0.587 * cd[i + 1] + 0.114 * cd[i + 2];
        const alpha = Math.min(1, Math.max(0, (luma - 5) / 18));
        cd[i + 3] = Math.round(alpha * 255);
      }
      cutCtx.putImageData(cutImg, 0, 0);

      setProgress(94);

      // 4) Build 3D Surface Candidates (Seamless Elliptical Volume + True Clay Shading)
      const candidates = [];
      for (let y = 3; y < H - 3; y++) {
        const cx = smoothCenterX[y];
        const hw = smoothHalfW[y];

        for (let x = 3; x < W - 3; x++) {
          const idx = y * W + x;
          if (!clayMask[idx]) continue;

          const i = idx * 4;
          const pr = photoData[i], pg = photoData[i + 1], pb = photoData[i + 2];
          const cGray = clayLuma[idx];

          // 5x5 local average for high-pass structure (hair strands, collar, zipper, seams)
          const blurAvg = (
            clayLuma[(y - 2) * W + x] +
            clayLuma[(y + 2) * W + x] +
            clayLuma[y * W + (x - 2)] +
            clayLuma[y * W + (x + 2)] +
            clayLuma[(y - 2) * W + (x - 2)] +
            clayLuma[(y - 2) * W + (x + 2)] +
            clayLuma[(y + 2) * W + (x - 2)] +
            clayLuma[(y + 2) * W + (x + 2)]
          ) * 0.125;

          // Gradient for micro-edges and surface normal perturbation
          const gx = (clayLuma[y * W + (x + 2)] - clayLuma[y * W + (x - 2)]) / 255.0;
          const gy = (clayLuma[(y + 2) * W + x] - clayLuma[(y - 2) * W + x]) / 255.0;
          const edgeMag = Math.min(1.0, Math.hypot(gx, gy) * 4.2);

          // Normalized screen coordinates
          const nx = (x / W) - 0.5;
          const ny = 0.5 - (y / H);

          // Smooth radial weight over the featureless face oval (NO hard step or rectangle!)
          const faceDx = nx / 0.135;
          const faceDy = (ny - 0.085) / 0.195;
          const faceDistSq = faceDx * faceDx + faceDy * faceDy;
          const faceSmoothFactor = Math.exp(-faceDistSq * 1.65); // 1.0 at center of face, smoothly 0.0 outside

          // True clay luminance (In clay-front.png, bright clay is ~210, dark grooves are ~90)
          // Normalize so bright clay surfaces are bright and dark grooves are dark
          const baseClayTone = Math.max(0.0, Math.min(1.0, (cGray - 75.0) / 148.0));

          // Local contrast (positive on ridge highlights, negative in deep hair/hoodie grooves)
          const localDetail = ((cGray - blurAvg) / 42.0) * (1.0 - 0.72 * faceSmoothFactor);
          const edgeHighlight = edgeMag * 0.28 * (1.0 - 0.80 * faceSmoothFactor);

          // Horizontal slice coordinate in [-1, 1]
          const u = Math.max(-0.98, Math.min(0.98, (x - cx) / hw));
          const ellipseZ = Math.sqrt(Math.max(0.02, 1.0 - u * u));

          // Combine clay tone + local hair/clothing detail + soft 3D dome shading
          let brightness = baseClayTone * 0.76 + localDetail * 0.34 + edgeHighlight + ellipseZ * 0.18;

          // Smooth featureless face oval: soft, even studio falloff with zero harsh edges
          const smoothFaceTone = 0.62 * Math.pow(ellipseZ, 0.45) + 0.18 * baseClayTone;
          brightness = brightness * (1.0 - faceSmoothFactor * 0.65) + smoothFaceTone * (faceSmoothFactor * 0.65);

          // Continuous 3D depth Z from front width & 90-degree side profile span
          const depthScale = Math.max(0.16, sideSpan[y] * 0.88);
          const reliefZ = (baseClayTone - 0.5) * 0.024 * (1.0 - 0.6 * faceSmoothFactor);
          const zPos = ellipseZ * depthScale + reliefZ;

          // Smooth 3D surface normal
          const normX = u * 0.82 - gx * 0.45 * (1.0 - 0.7 * faceSmoothFactor);
          const normY = (ny * 0.28) + gy * 0.45 * (1.0 - 0.7 * faceSmoothFactor);
          const normZ = Math.max(0.28, ellipseZ);
          const nLen = Math.hypot(normX, normY, normZ) || 1.0;

          const nxNorm = normX / nLen;
          const nyNorm = normY / nLen;
          const nzNorm = normZ / nLen;

          // Dim flat upward-facing shoulder ledges subtly
          if (nyNorm > 0.62 && ny < -0.05) {
            brightness *= 0.72;
          }

          brightness = Math.max(0.08, Math.min(1.0, brightness));

          candidates.push({
            x: nx * (16 / 9),
            y: ny,
            z: zPos,
            nx: nxNorm,
            ny: nyNorm,
            nz: nzNorm,
            brightness,
            r: pr / 255,
            g: pg / 255,
            b: pb / 255
          });
        }
      }

      // 5) Sample 78,000 Dots with Poisson-like Blue-Noise Jitter & Brightness Weighting
      const N = TARGET_DOT_COUNT;
      const positions = new Float32Array(N * 3);
      const ringPositions = new Float32Array(N * 3);
      const normals = new Float32Array(N * 3);
      const photoColors = new Float32Array(N * 3);
      const brightnessArr = new Float32Array(N);
      const randomArr = new Float32Array(N);

      const candLen = candidates.length;
      for (let i = 0; i < N; i++) {
        // Stratified traversal + slight importance preference for brighter ridges
        let cIdx = Math.floor(((i + Math.random()) / N) * candLen) % candLen;
        let c = candidates[cIdx];
        if (c.brightness < 0.28 && Math.random() < 0.30) {
          cIdx = Math.floor(Math.random() * candLen);
          c = candidates[cIdx];
        }

        // Tighter spacing in bright areas
        const spread = 0.0019 * (1.12 - 0.32 * c.brightness);
        positions[i * 3]     = c.x + (Math.random() - 0.5) * spread;
        positions[i * 3 + 1] = c.y + (Math.random() - 0.5) * spread;
        positions[i * 3 + 2] = c.z;

        // Preloader ring starting positions
        const angle = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.04;
        const radius = 0.15 + (Math.random() - 0.5) * 0.007;
        ringPositions[i * 3]     = Math.cos(angle) * radius;
        ringPositions[i * 3 + 1] = Math.sin(angle) * radius;
        ringPositions[i * 3 + 2] = 0.0;

        normals[i * 3]     = c.nx;
        normals[i * 3 + 1] = c.ny;
        normals[i * 3 + 2] = c.nz;

        photoColors[i * 3]     = c.r;
        photoColors[i * 3 + 1] = c.g;
        photoColors[i * 3 + 2] = c.b;

        brightnessArr[i] = c.brightness;
        randomArr[i]     = Math.random();
      }

      setProgress(100);
      setTimeout(() => {
        preloader.classList.add('hidden');
        startWebGL(cutoutCanvas, {
          positions,
          ringPositions,
          normals,
          photoColors,
          brightnessArr,
          randomArr
        });
      }, 220);
    }

    function startWebGL(cutoutCanvas, dotData) {
      const canvas = document.getElementById('webgl-canvas');
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();

      // Orthographic camera framed so the crown of the hair has clean headroom
      const viewHeight = 0.96;
      const yOffset = 0.02;
      const aspect = window.innerWidth / window.innerHeight;
      const camera = new THREE.OrthographicCamera(
        (-viewHeight * aspect) / 2,
        (viewHeight * aspect) / 2,
        viewHeight / 2 + yOffset,
        -viewHeight / 2 + yOffset,
        -10,
        10
      );
      camera.position.z = 2;

      // 1) Cut-out Photo Plane (Revealed via growing circular grid)
      const photoTex = new THREE.CanvasTexture(cutoutCanvas);
      photoTex.minFilter = THREE.LinearFilter;
      photoTex.magFilter = THREE.LinearFilter;

      const photoGeo = new THREE.PlaneGeometry(16 / 9, 1, 1, 1);
      const photoMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uPhotoTex: { value: photoTex },
          uReveal: { value: 0.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uPhotoTex;
          uniform float uReveal;
          varying vec2 vUv;

          void main() {
            if (uReveal <= 0.001) discard;
            vec4 tex = texture2D(uPhotoTex, vUv);
            if (tex.a <= 0.01) discard;

            float sweepY = 1.05 - uReveal * 1.25;
            float localP = clamp((vUv.y - sweepY) / 0.20, 0.0, 1.0);
            if (localP <= 0.0) discard;

            vec2 grid = fract(vUv * vec2(140.0, 78.0)) - 0.5;
            float dist = length(grid);
            float maxR = localP * 0.78;
            float circleMask = 1.0 - smoothstep(maxR - 0.05, maxR + 0.02, dist);

            gl_FragColor = vec4(tex.rgb, tex.a * circleMask);
          }
        `
      });
      const photoMesh = new THREE.Mesh(photoGeo, photoMat);
      photoMesh.position.z = -0.02;
      scene.add(photoMesh);

      // 2) 78,000 Dark Crimson Micro-Dots
      const dotGeo = new THREE.BufferGeometry();
      dotGeo.setAttribute('position', new THREE.BufferAttribute(dotData.positions, 3));
      dotGeo.setAttribute('aRingPos', new THREE.BufferAttribute(dotData.ringPositions, 3));
      dotGeo.setAttribute('aNormal', new THREE.BufferAttribute(dotData.normals, 3));
      dotGeo.setAttribute('aPhotoColor', new THREE.BufferAttribute(dotData.photoColors, 3));
      dotGeo.setAttribute('aBrightness', new THREE.BufferAttribute(dotData.brightnessArr, 1));
      dotGeo.setAttribute('aRandom', new THREE.BufferAttribute(dotData.randomArr, 1));

      function computeViewportScale() {
        // Scales dot size proportionally so mobile landscape never blows out into solid red
        return Math.max(0.55, Math.min(1.15, window.innerHeight / 820));
      }

      const dotMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uIntro: { value: 0.0 },
          uIntroSweep: { value: 1.2 },
          uReveal: { value: 0.0 },
          uRotY: { value: 0.0 },
          uRotX: { value: 0.0 },
          uCursor: { value: new THREE.Vector2(0.0, 0.0) },
          uPointScale: { value: dpr * computeViewportScale() }
        },
        vertexShader: `
          attribute vec3 aRingPos;
          attribute vec3 aNormal;
          attribute vec3 aPhotoColor;
          attribute float aBrightness;
          attribute float aRandom;

          uniform float uIntro;
          uniform float uIntroSweep;
          uniform float uReveal;
          uniform float uRotY;
          uniform float uRotX;
          uniform vec2 uCursor;
          uniform float uPointScale;

          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            float delay = aRandom * 0.24;
            float flyT = clamp((uIntro - delay) / 0.76, 0.0, 1.0);
            float easeFly = 1.0 - pow(1.0 - flyT, 3.0);

            vec3 restPos = position;

            // Smooth neck/shoulder weight so head rotates up to 30 deg while shoulders follow gently
            float headWeight = smoothstep(-0.38, 0.04, restPos.y);
            float weight = 0.24 + 0.76 * headWeight;

            float activeTrack = 1.0 - smoothstep(0.0, 0.16, uReveal);
            float ry = uRotY * weight * activeTrack;
            float rx = uRotX * weight * 0.60 * activeTrack;

            float cy = cos(ry), sy = sin(ry);
            vec3 p = restPos;
            p.x = restPos.x * cy + restPos.z * sy;
            p.z = -restPos.x * sy + restPos.z * cy;

            float cx = cos(rx), sx = sin(rx);
            float py = p.y * cx - p.z * sx;
            float pz = p.y * sx + p.z * cx;
            p.y = py;
            p.z = pz;

            // Top-to-bottom Reveal sweep
            float sweepY = 1.05 - uReveal * 1.25;
            float dotSweep = clamp(((restPos.y + 0.5) - sweepY) / 0.18, 0.0, 1.0);

            // Above the sweep band, dots press flat onto the photo
            p = mix(p, vec3(restPos.x, restPos.y, 0.0), dotSweep);

            vec3 finalPos = mix(aRingPos, p, easeFly);

            vec3 n = aNormal;
            n.x = aNormal.x * cy + aNormal.z * sy;
            n.z = -aNormal.x * sy + aNormal.z * cy;

            // Studio key light + subtle rim + cursor light
            vec3 keyDir = normalize(vec3(0.28, 0.42, 0.86));
            float diff = max(0.0, dot(n, keyDir));
            float rim  = pow(1.0 - max(0.0, n.z), 2.4) * 0.38;

            float cursorDist = length(finalPos.xy - uCursor);
            float cursorBoost = smoothstep(0.46, 0.0, cursorDist) * 0.42 * activeTrack;

            // Single band of light sweeping down the bust once after fly-in
            float introBand = exp(-pow((restPos.y - uIntroSweep) * 10.0, 2.0)) * 0.58;

            // Deep dark crimson (rgb 0.64, 0.035, 0.055) tuned to prevent additive blowout
            vec3 crimson = vec3(0.64, 0.035, 0.055);
            float tonal = pow(aBrightness, 1.25);
            float shade = tonal * (0.48 + 0.52 * diff) + rim * aBrightness + cursorBoost * aBrightness + introBand;

            vec3 baseDotColor = crimson * shade * 0.78;

            // Reveal band transition to photo colors
            float bandEdge = exp(-pow(((restPos.y + 0.5) - sweepY) * 14.0, 2.0)) * step(0.001, uReveal);
            vec3 finalCol = mix(baseDotColor, aPhotoColor * 0.75, dotSweep);
            finalCol += crimson * bandEdge * 0.85;

            vColor = finalCol;
            vAlpha = (1.0 - smoothstep(0.25, 0.94, dotSweep)) * (0.26 + 0.52 * tonal);

            gl_Position = projectionMatrix * modelViewMatrix * vec4(finalPos, 1.0);

            // Crisp micro-dots of varying size
            float ptSize = mix(1.15, 2.55, tonal) * (0.85 + 0.30 * aRandom);
            gl_PointSize = max(1.1, ptSize * uPointScale);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r = dot(cxy, cxy);
            if (r > 1.0) discard;
            float softCircle = pow(1.0 - r, 1.75);
            gl_FragColor = vec4(vColor, vAlpha * softCircle);
          }
        `
      });

      const dotCloud = new THREE.Points(dotGeo, dotMat);
      scene.add(dotCloud);

      // 3) Faint Drifting Dust Particles
      const dustCount = 180;
      const dustPositions = new Float32Array(dustCount * 3);
      for (let i = 0; i < dustCount; i++) {
        dustPositions[i * 3]     = (Math.random() - 0.5) * 2.2;
        dustPositions[i * 3 + 1] = (Math.random() - 0.5) * 1.2;
        dustPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
      }
      const dustGeo = new THREE.BufferGeometry();
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
      const dustMat = new THREE.PointsMaterial({
        color: new THREE.Color(0.64, 0.035, 0.055),
        size: 1.6 * dpr,
        transparent: true,
        opacity: 0.18,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const dustParticles = new THREE.Points(dustGeo, dustMat);
      scene.add(dustParticles);

      // Cursor & Mobile Touch Tracking
      let targetRotY = 0, targetRotX = 0;
      let currentRotY = 0, currentRotX = 0;
      let cursorX = 0, cursorY = 0;
      let hasMoved = false;

      function updatePointer(clientX, clientY) {
        hasMoved = true;
        const nx = (clientX / window.innerWidth) * 2 - 1;
        const ny = -(clientY / window.innerHeight) * 2 + 1;
        targetRotY = nx * 0.5236; // Up to 30 degrees
        targetRotX = -ny * 0.22;
        cursorX = nx * (viewHeight * (window.innerWidth / window.innerHeight)) * 0.5;
        cursorY = ny * (viewHeight * 0.5);
      }

      window.addEventListener('pointermove', (e) => updatePointer(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      // Reveal / Back to dots toggle
      let isRevealed = false;
      let revealTarget = 0.0;
      let revealCurrent = 0.0;

      revealBtn.addEventListener('click', () => {
        isRevealed = !isRevealed;
        revealTarget = isRevealed ? 1.0 : 0.0;
        revealBtn.textContent = isRevealed ? 'Back to dots' : 'Reveal';
      });

      uiControls.classList.add('ready');

      const startTime = performance.now();
      let lastTime = startTime;

      function renderLoop(now) {
        requestAnimationFrame(renderLoop);
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const elapsed = (now - startTime) / 1000;

        // Fly-in from preloader ring + single light band sweep
        dotMat.uniforms.uIntro.value = Math.min(1.0, elapsed / 1.3);
        if (elapsed > 1.1 && elapsed < 2.5) {
          const t = (elapsed - 1.1) / 1.4;
          dotMat.uniforms.uIntroSweep.value = 0.55 - t * 1.1;
        } else {
          dotMat.uniforms.uIntroSweep.value = -2.0;
        }

        // Gentle idle drift before first touch/cursor move
        if (!hasMoved && revealCurrent < 0.05) {
          targetRotY = Math.sin(elapsed * 0.85) * 0.14;
          targetRotX = Math.cos(elapsed * 0.6) * 0.05;
        }

        if (revealCurrent >= 0.999) {
          currentRotY = 0;
          currentRotX = 0;
        } else {
          currentRotY += (targetRotY - currentRotY) * Math.min(1.0, dt * 5.8);
          currentRotX += (targetRotX - currentRotX) * Math.min(1.0, dt * 5.8);
        }

        dotMat.uniforms.uRotY.value = currentRotY;
        dotMat.uniforms.uRotX.value = currentRotX;
        dotMat.uniforms.uCursor.value.set(cursorX, cursorY);

        // 3.6-second Reveal sweep
        if (Math.abs(revealTarget - revealCurrent) > 0.0005) {
          const step = dt / REVEAL_DURATION;
          revealCurrent = revealCurrent < revealTarget
            ? Math.min(revealTarget, revealCurrent + step)
            : Math.max(revealTarget, revealCurrent - step);

          dotMat.uniforms.uReveal.value = revealCurrent;
          photoMat.uniforms.uReveal.value = revealCurrent;

          // Banner turns crimson fading to near-black in step with the band
          const m = revealCurrent;
          const r = Math.round(140 + (163 - 140) * m);
          const g = Math.round(140 * (1 - m) + 9 * m);
          const b = Math.round(148 * (1 - m) + 14 * m);
          bannerText.style.background = `linear-gradient(180deg, rgba(${r}, ${g}, ${b}, ${0.32 + m * 0.38}) 0%, rgba(${Math.round(r * 0.22)}, 7, 9, 0.13) 66%, rgba(4, 4, 5, 0) 100%)`;
          bannerText.style.webkitBackgroundClip = 'text';
          bannerText.style.backgroundClip = 'text';
        }

        if (revealCurrent < 0.99) {
          dustParticles.rotation.y = elapsed * 0.018;
          dustParticles.position.y = Math.sin(elapsed * 0.35) * 0.018;
          dustMat.opacity = 0.18 * (1.0 - revealCurrent);
        } else {
          dustMat.opacity = 0.0;
        }

        renderer.render(scene, camera);
      }

      requestAnimationFrame(renderLoop);

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        const asp = w / h;
        camera.left = (-viewHeight * asp) / 2;
        camera.right = (viewHeight * asp) / 2;
        camera.top = viewHeight / 2 + yOffset;
        camera.bottom = -viewHeight / 2 + yOffset;
        camera.updateProjectionMatrix();
        dotMat.uniforms.uPointScale.value = dpr * computeViewportScale();
      });
    }

    boot();
  </script>
</body>
</html>
